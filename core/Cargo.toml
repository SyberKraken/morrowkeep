[package]
name = "morrowkeep-core"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Morrowkeep's rules shared by the desktop app and the phone (as WebAssembly): parsing, tasks, foods, body, journal, workouts and the steps that change them."

[dependencies]
chrono = { version = "0.4", default-features = false, features = ["serde", "std", "clock"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "~1.26" }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
uuid = { version = "~1.26", features = ["v4"] }

[lib]
# rlib for the desktop app, cdylib for the phone's WebAssembly
crate-type = ["rlib", "cdylib"]
