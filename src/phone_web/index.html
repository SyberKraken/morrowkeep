<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0e121e">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Morrowkeep">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" href="/icon.png">
<link rel="apple-touch-icon" href="/icon.png">
<title>Morrowkeep</title>
<style>
:root {
  --page: #0e121e; --card: #161c2c; --border: #262e44; --input: #0a0d16; --text: #dce2ee; --muted: #8c96aa;
  --fill: #262f46; --selection: #465caa; --accent: #aabcff; --on-color: #fff; --success: #2ea067; --danger: #dc503c;
  --warning: #e8a532; --brand: #2ea067; --calories: #eb7832; --weight: #468ce6; --journal: #e284c4; --goal: #50c8a0; --claude: #d97757;
  --radius: 14px;
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; background: var(--page); color: var(--text); font: 16px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
body { padding: env(safe-area-inset-top) 0 calc(72px + env(safe-area-inset-bottom)); min-height: 100vh; }
main { padding: 12px 14px 20px; max-width: 560px; margin: 0 auto; }
header { display: flex; justify-content: space-between; align-items: center; padding: 6px 2px 10px; }
header .brand { font-weight: 600; color: var(--brand); font-size: 18px; }
.muted { color: var(--muted); font-size: 13px; }
.card { background: var(--card); border: 1px solid var(--border); border-radius: var(--radius); padding: 12px 14px; margin-bottom: 12px; }
.card h3 { margin: 0 0 6px; font-size: 13px; font-weight: 500; color: var(--muted); }
.big { font-size: 30px; font-weight: 650; line-height: 1.1; }
.row { display: flex; gap: 8px; align-items: center; }
.row > .grow { flex: 1; min-width: 0; }
input, textarea, select { width: 100%; background: var(--input); color: var(--text); border: 1px solid var(--border); border-radius: 10px; padding: 10px 12px; font: inherit; }
textarea { min-height: 84px; resize: vertical; }
input:focus, textarea:focus, select:focus { outline: 2px solid var(--selection); outline-offset: 0; }
button { font: inherit; color: var(--text); background: var(--fill); border: 1px solid var(--border); border-radius: 10px; padding: 10px 14px; min-height: 44px; cursor: pointer; }
button.primary { background: var(--selection); border-color: var(--accent); font-weight: 600; }
button.small { min-height: 34px; padding: 6px 10px; font-size: 14px; }
button.block { width: 100%; }
button:disabled { opacity: .5; }
button.rec { background: var(--danger); color: var(--on-color); border-color: var(--danger); }
.bar { height: 7px; border-radius: 4px; background: var(--fill); overflow: hidden; margin: 8px 0; }
.bar > div { height: 100%; border-radius: 4px; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip { border: 1px solid var(--border); background: var(--fill); border-radius: 999px; padding: 7px 12px; font-size: 14px; }
.list .item { display: flex; gap: 10px; align-items: center; padding: 10px 2px; border-top: 1px solid var(--border); }
.list .item:first-child { border-top: 0; }
.task { display: flex; gap: 12px; align-items: center; padding: 11px 2px; border-top: 1px solid var(--border); }
.task:first-child { border-top: 0; }
.dot { width: 22px; height: 22px; border-radius: 50%; border: 2px solid; flex: none; display: grid; place-items: center; font-size: 13px; color: var(--on-color); }
.stars { display: flex; gap: 7px; align-items: center; flex-wrap: wrap; padding: 2px 2px 12px; }
.star { width: 12px; height: 12px; border-radius: 50%; border: 1.5px solid; }
.entry { padding: 10px 0; border-top: 1px solid var(--border); }
.entry:first-child { border-top: 0; }
.entry .meta { color: var(--muted); font-size: 13px; }
.preview { font-family: ui-monospace, Consolas, monospace; font-size: 13px; white-space: pre-wrap; margin: 8px 0; }
.error { color: var(--danger); font-size: 14px; margin-top: 6px; }
.moods { display: flex; gap: 10px; align-items: center; }
.mood { width: 28px; height: 28px; border-radius: 50%; border: 2px solid; background: transparent; padding: 0; min-height: 0; }
nav { position: fixed; left: 0; right: 0; bottom: 0; display: flex; background: var(--card); border-top: 1px solid var(--border); padding-bottom: env(safe-area-inset-bottom); z-index: 5; }
nav button { flex: 1; background: none; border: 0; border-radius: 0; color: var(--muted); font-size: 12px; padding: 8px 0 10px; min-height: 60px; }
nav button .ic { display: block; font-size: 20px; line-height: 1.2; }
nav button.on { color: var(--text); }
#toast { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(80px + env(safe-area-inset-bottom)); background: var(--card); border: 1px solid var(--border); border-radius: 999px; padding: 10px 16px; font-size: 14px; max-width: 92vw; display: none; z-index: 9; }
#queue { color: var(--warning); font-size: 13px; }
.hidden { display: none !important; }
.center { text-align: center; }
</style>
</head>
<body>
<main id="app"><p class="muted center" style="margin-top:40vh">Loading Morrowkeep…</p></main>
<nav id="nav" class="hidden">
  <button data-tab="today"><span class="ic">☀</span>Today</button>
  <button data-tab="food"><span class="ic">🍴</span>Food</button>
  <button data-tab="journal"><span class="ic">✎</span>Journal</button>
  <button data-tab="ask"><span class="ic">✦</span>Ask</button>
</nav>
<div id="toast"></div>
<script src="/app.js"></script>
</body>
</html>
